AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SpoonManagerBot application: Fargate worker task definition (no Service),
  OAuth callback (HTTP API + Lambda), and the IAM-only Control Lambda that
  starts and stops the worker. Uses one container image for all three.

Parameters:
  ProjectName:
    Type: String
    Default: spoon-manager-bot
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  ImageUri:
    Type: String
    AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9-]+@sha256:[0-9a-f]{64}$'
    Description: Worker/Lambda image pinned by digest (repository@sha256:...).
  SpoonRegion:
    Type: String
    Default: jp
    AllowedValues:
      - jp
  IgnoredUserIds:
    Type: String
    Default: ''
    Description: Comma-separated Spoon user ids (e.g. other bots) to ignore.
  LiveWaitLimitSeconds:
    Type: Number
    Default: 600
    MinValue: 60
    MaxValue: 3600
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  WorkerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  StateTableName:
    Type: String
  StateTableArn:
    Type: String
  EcsClusterName:
    Type: String
  EcsClusterArn:
    Type: String
  EcsTaskExecutionRoleArn:
    Type: String
  EcsTaskRoleArn:
    Type: String
  WorkerLogGroupName:
    Type: String
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30

Resources:
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-worker'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !Ref EcsTaskExecutionRoleArn
      TaskRoleArn: !Ref EcsTaskRoleArn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ImageUri
          Essential: true
          EntryPoint:
            - python3
            - -m
            - spoon_manager_bot.worker
          User: '1000'
          ReadonlyRootFilesystem: true
          StopTimeout: 30
          LinuxParameters:
            InitProcessEnabled: true
            Capabilities:
              Drop:
                - ALL
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: STATE_TABLE
              Value: !Ref StateTableName
            - Name: SSM_PREFIX
              Value: !Sub '/${ProjectName}/${Environment}/'
            - Name: SPOON_REGION
              Value: !Ref SpoonRegion
            - Name: LIVE_WAIT_LIMIT_SECONDS
              Value: !Ref LiveWaitLimitSeconds
            - Name: IGNORED_USER_IDS
              Value: !Ref IgnoredUserIds
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------- OAuth callback ----------

  OAuthCallbackLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-oauth-callback'
      RetentionInDays: !Ref LogRetentionDays

  OAuthCallbackRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-oauth-callback'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: oauth-callback
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${OAuthCallbackLogGroup.Arn}:*'
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !Ref StateTableArn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/oauth/*'
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/token/*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  OAuthCallbackFunction:
    Type: AWS::Lambda::Function
    DependsOn: OAuthCallbackLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-oauth-callback'
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - spoon_manager_bot.oauth_callback.handler
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt OAuthCallbackRole.Arn
      Environment:
        Variables:
          STATE_TABLE: !Ref StateTableName
          SSM_PREFIX: !Sub '/${ProjectName}/${Environment}/'
          SPOON_REGION: !Ref SpoonRegion
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CallbackApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-oauth'
      ProtocolType: HTTP
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

  CallbackIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CallbackApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OAuthCallbackFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  CallbackRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CallbackApi
      RouteKey: GET /oauth/callback
      Target: !Sub 'integrations/${CallbackIntegration}'

  CallbackStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref CallbackApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 1

  CallbackInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OAuthCallbackFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CallbackApi}/*/GET/oauth/callback'

  # ---------- Control (start / stop) ----------

  ControlLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-control'
      RetentionInDays: !Ref LogRetentionDays

  ControlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-control'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: control-worker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${ControlLogGroup.Arn}:*'
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !Ref StateTableArn
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-${Environment}-worker:*'
                Condition:
                  ArnEquals:
                    ecs:cluster: !Ref EcsClusterArn
              - Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:StopTask
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${EcsClusterName}/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref EcsTaskExecutionRoleArn
                  - !Ref EcsTaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ControlFunction:
    Type: AWS::Lambda::Function
    DependsOn: ControlLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-control'
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - spoon_manager_bot.control.handler
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt ControlRole.Arn
      Environment:
        Variables:
          STATE_TABLE: !Ref StateTableName
          ECS_CLUSTER: !Ref EcsClusterName
          TASK_DEFINITION: !Ref WorkerTaskDefinition
          CONTAINER_NAME: worker
          SUBNET_IDS: !Join [',', !Ref SubnetIds]
          SECURITY_GROUP_ID: !Ref WorkerSecurityGroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  OAuthCallbackUrl:
    Description: Register this exact URL as the login redirect URL of the Spoon Developer App.
    Value: !Sub 'https://${CallbackApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/oauth/callback'
  ControlFunctionName:
    Value: !Ref ControlFunction
  WorkerTaskDefinitionArn:
    Value: !Ref WorkerTaskDefinition
