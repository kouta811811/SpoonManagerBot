name: Deploy dev foundation

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/foundation.yaml'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev-foundation
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy foundation to dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ap-northeast-1
      STACK_NAME: spoon-manager-bot-dev-foundation
      PROJECT_NAME: spoon-manager-bot
      ENVIRONMENT: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-deploy-dev

      - name: Confirm target AWS account
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${account_id}" != "${{ secrets.AWS_ACCOUNT_ID }}" ]]; then
            echo "AWS account mismatch: expected ${{ secrets.AWS_ACCOUNT_ID }}, got ${account_id}." >&2
            exit 1
          fi
          echo "Deploying to account ${account_id}."

      - name: Validate template
        run: |
          aws cloudformation validate-template \
            --region "${AWS_REGION}" \
            --template-body "file://infrastructure/foundation.yaml" >/dev/null

      - name: Deploy foundation stack
        run: |
          aws cloudformation deploy \
            --region "${AWS_REGION}" \
            --stack-name "${STACK_NAME}" \
            --template-file infrastructure/foundation.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "Environment=${ENVIRONMENT}" \
            --tags \
              "Project=${PROJECT_NAME}" \
              "Environment=${ENVIRONMENT}" \
              "ManagedBy=GitHubActions"

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --region "${AWS_REGION}" \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs' \
            --output table
