name: Debug OIDC claims

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  show-claims:
    name: Show OIDC claims
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Print sub and aud only
        run: |
          set -euo pipefail
          token="$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')"
          payload="$(printf '%s' "$token" | cut -d. -f2)"
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==";;
            3) payload="${payload}=";;
          esac
          decoded="$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null)"
          echo "sub = $(printf '%s' "$decoded" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("sub"))')"
          echo "aud = $(printf '%s' "$decoded" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("aud"))')"
          echo "repository = $(printf '%s' "$decoded" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("repository"))')"
          echo "environment = $(printf '%s' "$decoded" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("environment"))')"
